[package]
name = "typhoon_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
chrono = "0.4.45"
crossbeam-channel = "0.5.15"
enigo = "0.6.1"
flexaudio = "0.2.0"
image = "0.25.10"
oar-ocr = "0.6.3"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows-capture = "2.0.0"
